name: 공고 자동 수집

on:
  schedule:
    - cron: "40 23 * * *"     # 매일 08:40 (한국시간)
  workflow_dispatch:
    inputs:
      force:
        description: "접수중 공고 전체 재분석"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수출e음 공고 수집·분석
        # 공공기관 사이트의 중간 인증서 누락 대응: 공개 공고 조회 전용이라 인증서 검증 생략
        run: python ax_collect.py --insecure --max-pages 3 ${{ inputs.force && '--force' || '' }}
      - name: 웹페이지 데이터 갱신
        run: python export_static.py
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ax_notices.db docs/data
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "공고 데이터 갱신 $(date '+%Y-%m-%d %H:%M')" && git push; fi
